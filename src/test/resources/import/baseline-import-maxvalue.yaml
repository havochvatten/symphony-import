# newBaseline with a calibrated calculation area ('maxValue' attribute in the GeoPackage).

operation: newBaseline

baseline:
  name: test-import-tiff
  title: Test Baseline with a calibrated calculation area
  validFrom: "2027-01-01"
  locale: en
  ecoPath: ../baseline/symphony-import-test-BaselineE.tiff
  pressurePath: ../baseline/symphony-import-test-BaselineP.tiff

metadata:
  - file: metadata-wellformed-complete-sv.csv
    language: sv
  - file: metadata-wellformed-complete-en.csv
    language: en

matrices:
  - file: matrix-wellformed-en.csv
    name: Complete sensitivity matrix TEST
    language: en

calculationAreas:
  file: calcarea-package-maxvalue.gpkg
  defaultAreas:
    - test-calc-area-calibrated
